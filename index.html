<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Skill Loop: career and skill navigation for students. Learn, build, prove, improve.">
<title>Skill Loop Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Dark editorial, single theme by choice. Layout: nav rail + one calm reading column; the gap bar is the only loud object. */
:root{
  --bg:#131412; --surface:#1A1B18; --raise:#20211E; --ink:#EFEBE2; --ink2:#B8B3A8; --ink3:#878279;
  --line:#34332E; --soft:#252622; --accent:#7CC0B4; --accent-ink:#0F1F1D; --tint:#1D2A28;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:3px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
h1,h2,h3,p{margin:0}
h1,h2,.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,44px);line-height:1.08}
h2{font-size:clamp(22px,2.8vw,28px);line-height:1.15}
h1:focus{outline:none}
#root{min-height:100%}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:22px;display:flex;align-items:center;gap:9px;padding-left:8px}
.brand svg{flex:none;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r);color:var(--ink2);font-weight:500;width:100%;transition:background .18s,color .18s,transform .18s}
.nav button:hover{color:var(--ink);background:var(--soft);transform:translateX(2px)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--soft)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:10px;align-items:center;width:100%;border-radius:var(--r)}
.who:hover .wn{text-decoration:underline;text-underline-offset:3px}
.who .wt{display:grid;font-size:12.5px;color:var(--ink3);min-width:0}
.who .wn{color:var(--ink);font-weight:600;font-size:13.5px}
.av{width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--tint)}
.link{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font-size:13px}
.link:hover{color:var(--ink);text-decoration-color:var(--ink)}
main{padding-block:48px 96px;padding-inline:clamp(16px,5vw,64px);min-width:0}
.col{max-width:860px;margin:0 auto;display:grid;gap:44px;animation:in .3s ease both}
.col.narrow{max-width:640px}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:none}
.eyebrow{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.eyebrow.ai{color:var(--accent);display:inline-flex;gap:7px;align-items:center}
.eyebrow.ai::before{content:"";width:6px;height:6px;background:var(--accent);transform:rotate(45deg)}
.lede{color:var(--ink2);font-size:16px;max-width:60ch}
.head{display:grid;gap:10px}
.sec{display:grid;gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink3);padding-bottom:8px;flex-wrap:wrap}
.back{color:var(--ink2);font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;justify-self:start}
.back:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--r);font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);transition:transform .16s,background .16s,box-shadow .16s}
.btn:hover{background:var(--ink);border-color:var(--ink);transform:translateY(-1px);box-shadow:0 6px 18px -10px #000}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:none;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border:1px solid var(--line);border-radius:2px;color:var(--ink2);white-space:nowrap}
.tag.crit{border-color:var(--ink2);color:var(--ink)}
.tag.on{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.tag.miss{border-style:dashed}
/* Evidence-Ticked Gap Bar */
.gb{display:grid;gap:5px;min-width:0}
.gb-track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;height:10px}
.gb-cell{background:var(--soft)}
.gb-cell.fill{background:var(--accent)}
.gb-cell.fill.unv{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.gb-cell.fresh{animation:grow .9s .35s cubic-bezier(.3,.7,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.gb-cell.gap{background:repeating-linear-gradient(135deg,var(--ink3) 0 1px,transparent 1px 5px);box-shadow:inset 0 0 0 1px var(--line)}
.gb-target{position:absolute;top:-4px;bottom:-4px;width:8px;border:1.5px solid var(--ink);background:var(--bg);border-radius:1px}
.gb-ticks{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;height:8px}
.gb-ticks span{display:flex;justify-content:center;gap:4px}
.tick{width:2px;height:8px;background:var(--ink)}
.tick.hollow{width:5px;background:none;border:1px solid var(--ink)}
.gb-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;font-size:11px;color:var(--ink3)}
.gb-scale b{color:var(--ink);font-weight:600}
.gb-cap{font-size:13px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink3);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
/* Today */
.hero{border:1px solid var(--line);border-top:1px solid var(--accent);border-radius:var(--r);background:var(--surface);padding:clamp(20px,3.5vw,36px);display:grid;gap:22px}
.hero h2{font-size:clamp(26px,3.6vw,36px)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin:0}
.facts>div{padding:14px 16px 0 0;display:grid;gap:3px}
.facts>div+div{border-left:1px solid var(--line);padding-left:16px}
.facts dt,.k{font-size:12px;color:var(--ink3)}
.facts dd{margin:0;font-weight:500}
details.why{border-top:1px solid var(--line);padding-top:14px}
details.why summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:"+";font-size:20px;font-weight:400;color:var(--ink3);transition:transform .2s}
details.why[open] summary::after{transform:rotate(45deg)}
.whys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;padding-top:14px}
.whys div{display:grid;gap:2px}
.whys p{color:var(--ink2);font-size:14px}
.ready{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 28px;align-items:center}
.ready .num{font-family:var(--serif);font-size:64px;line-height:1}
.ready .num small{font-size:26px;color:var(--ink3)}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:6px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.pips i.on{background:var(--accent);box-shadow:none}
.gaprow{display:grid;grid-template-columns:28px 150px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 8px;margin:0 -8px;border-bottom:1px solid var(--line);width:calc(100% + 16px);transition:background .18s,transform .18s}
.gaprow .rk{font-family:var(--serif);font-size:20px;color:var(--ink3)}
button.gaprow:hover,.lrow:hover,button.item:hover{background:var(--surface);transform:translateX(3px)}
.gaprow:hover .nm,.lrow:hover .nm{color:var(--accent)}
.nm{font-family:var(--serif);font-size:20px;transition:color .18s}
.loop{display:grid;grid-template-columns:repeat(4,1fr)}
.loop div{padding:12px 12px 12px 0;border-top:2px solid var(--line);display:grid;gap:2px;color:var(--ink3);align-content:start}
.loop div.done{border-color:var(--ink3);color:var(--ink2)}
.loop div.now{border-color:var(--accent);color:var(--ink)}
.loop b{font-family:var(--serif);font-weight:400;font-size:20px}
.loop span{font-size:12.5px}
/* Ledger */
.ctrl{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button,.seg label{padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink2);border-right:1px solid var(--line);cursor:pointer;transition:background .15s,color .15s}
.seg>:last-child{border-right:0}
.seg button:hover,.seg label:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg label:has(:checked){background:var(--ink);color:var(--bg)}
.seg label:has(:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.lhead,.lrow{display:grid;grid-template-columns:minmax(120px,1.2fr) 92px minmax(140px,1.7fr) 84px 84px 78px 14px;gap:18px;align-items:center}
.lhead{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--ink3)}
.lrow{width:calc(100% + 16px);margin:0 -8px;padding:18px 8px;border-bottom:1px solid var(--line);transition:background .18s,transform .18s}
.lrow .m{display:none}
.sub{font-size:12px;color:var(--ink3)}
.chev{color:var(--ink3)}
.list{display:grid}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;transition:background .18s,transform .18s}
.item .sub{font-size:13px;grid-column:1}
.item .tag{grid-row:1;grid-column:2}
.ledger{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:6px;color:var(--ink2)}
.empty b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px;display:grid;gap:10px}
.panel.ok{border-color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink2);border-radius:2px;margin:2px 0 0;flex:none;display:grid;place-items:center;transition:background .15s}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:9px;height:5px;border:solid var(--accent-ink);border-width:0 0 2px 2px;transform:rotate(-45deg) translateY(-1px)}
.check input:checked+span{color:var(--ink3);text-decoration:line-through}
.check.static{cursor:default}
.prog{height:4px;background:var(--soft)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-size:13px;font-weight:600}
.field input[type=text],.field input[type=url],.field select,.field textarea,select.sel{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--ink3)}
.err{font-size:13px;color:var(--ink);font-weight:500;border-left:2px solid var(--ink);padding-left:10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ba{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:16px;align-items:start}
.ba>div{display:grid;gap:12px}
.ba .lv{font-family:var(--serif);font-size:30px;line-height:1}
.ba .arrow{align-self:center;color:var(--ink3);font-size:20px;text-align:center}
.note{border-left:2px solid var(--accent);padding:2px 0 2px 16px;color:var(--ink2);max-width:60ch}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.kv>div{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:3px}
.kv .v{font-family:var(--serif);font-size:22px}
.plate{display:grid;grid-template-columns:72px minmax(0,1fr);gap:24px;padding:26px 0;border-bottom:1px solid var(--line);transition:transform .2s}
.plate:hover{transform:translateX(4px)}
.plate .no{font-family:var(--serif);font-size:40px;line-height:1;color:var(--ink3)}
.plate h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15}
.plate>div{display:grid;gap:8px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);text-align:left;font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--ink3)}
td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.s{font-family:var(--serif);font-size:19px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.cmp ul,.plain{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px;color:var(--ink2)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.weeks>div{border-top:2px solid var(--accent);padding:12px 16px 0 0;display:grid;gap:6px;align-content:start;animation:in .4s both}
.weeks>div:nth-child(2){animation-delay:.08s}.weeks>div:nth-child(3){animation-delay:.16s}.weeks>div:nth-child(4){animation-delay:.24s}
.weeks b{font-family:var(--serif);font-weight:400;font-size:19px}
.think{display:grid;gap:8px;color:var(--ink2)}
.think span{animation:in .4s both}
.think span:nth-child(2){animation-delay:.35s}.think span:nth-child(3){animation-delay:.7s}
.pulse{width:28px;height:28px;border:1.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom{display:none}
/* Focused action flow */
.flowbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(16px,5vw,64px)}
.steps{display:flex;gap:6px 18px;list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.steps li{display:flex;gap:7px;align-items:center}
.steps li::before{content:"";width:14px;height:2px;background:var(--line)}
.steps li.done{color:var(--ink2)}.steps li.done::before{background:var(--ink3)}
.steps li.now{color:var(--ink);font-weight:600}.steps li.now::before{background:var(--accent)}
/* Landing */
.land{--gut:clamp(16px,5vw,72px);overflow-x:clip}
.land-top{display:flex;justify-content:space-between;align-items:center;padding-block:24px}
.land-top .brand,.lnav .brand{padding:0}
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px var(--gut);background:var(--bg);border-bottom:1px solid transparent;transition:padding .3s,border-color .3s}
.lnav.compact{padding-block:10px;border-color:var(--line)}
.lnav-links{display:flex;gap:28px}
.lnav-links button{color:var(--ink2);font-size:14px;font-weight:500;position:relative;padding:4px 0;transition:color .2s}
.lnav-links button::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--accent);transition:right .25s}
.lnav-links button:hover{color:var(--ink)}.lnav-links button:hover::after{right:0}
.btn.sm{padding:8px 14px;font-size:13.5px}
.lsec{padding:clamp(72px,11vw,150px) var(--gut);border-top:1px solid var(--line)}
.lwrap{max-width:1180px;margin:0 auto;width:100%}
.lsec h2{font-size:clamp(30px,4.6vw,56px);line-height:1.05;max-width:19ch}
.land em{font-style:italic;color:var(--accent)}
.lhd{display:grid;gap:16px;margin-bottom:clamp(36px,5vw,64px)}
.land-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center;padding:clamp(32px,6vw,80px) var(--gut) clamp(90px,10vw,150px);max-width:1324px;margin:0 auto}
.land-hero h1{font-size:clamp(38px,5.4vw,70px);line-height:1.02}
.land-copy{display:grid;gap:26px}
.stage{perspective:1500px;min-width:0;padding:56px 34px 76px 44px}
.stack{position:relative;transform-style:preserve-3d;transform:rotateX(calc(10deg + var(--tx,0deg))) rotateY(calc(-18deg + var(--ty,0deg)));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.layer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 30px 60px -30px #000;transition:border-color .3s}
.layer:hover{border-color:var(--accent)}
.l-map{padding:22px;display:grid;gap:15px}
.mr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;font-size:13px}
.l-career{position:absolute;left:-36px;top:-46px;padding:10px 14px;transform:translateZ(40px);background:var(--raise)}
.l-career::after{content:"";position:absolute;left:28px;top:100%;height:22px;border-left:1px dashed var(--ink3)}
.l-chip{position:absolute;right:-24px;top:-40px;padding:12px 16px;transform:translateZ(90px);background:var(--raise);animation:float 7s ease-in-out infinite}
.l-ev{position:absolute;right:-32px;bottom:-44px;padding:12px 14px;transform:translateZ(60px);background:var(--raise);display:grid;gap:6px;font-size:12.5px;animation:float 9s .5s ease-in-out infinite}
.l-ev div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.l-rec{position:absolute;left:-38px;bottom:-62px;padding:14px 18px;max-width:270px;transform:translateZ(130px);background:var(--raise);border-top-color:var(--accent);animation:float 8s 1s ease-in-out infinite}
@keyframes float{50%{translate:0 -7px}}
.flows{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(18px,4vw,56px);align-items:start}
.flow-col>.eyebrow{display:block;margin-bottom:14px}
.fstep{border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;font-family:var(--serif);font-size:clamp(17px,2vw,21px);position:relative;margin-bottom:24px;transition:opacity .5s,border-color .5s,background .5s,transform .5s}
.fstep:not(:last-child)::after{content:"";position:absolute;left:24px;top:calc(100% + 1px);height:24px;width:1px;background:var(--line)}
.flow-old .fstep{color:var(--ink2);border-style:dashed}
.flow-old .fstep:last-child{color:var(--ink)}
.flow-old.fade .fstep{opacity:.4}
.flow-new .fstep{opacity:.3;transform:translateX(-10px)}
.flow-new .fstep.on{opacity:1;transform:none;border-color:var(--ink3)}
.flow-new .fstep.on:last-child{border-color:var(--accent);background:var(--tint)}
.flow-mid{align-self:center;font-family:var(--serif);font-size:28px;color:var(--ink3)}
.loopgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,6vw,96px)}
.lstage{min-height:58vh;display:grid;align-content:center;gap:12px;opacity:.32;transition:opacity .4s;border-top:1px solid var(--line);padding-block:32px;cursor:default}
.lstage.on{opacity:1}
.lword{font-family:var(--serif);font-size:clamp(44px,6.4vw,84px);line-height:1}

/* ---------- Onboarding ---------- */
function Onb(){
  const o=S.ob,st=o.step,names=[...Object.keys(CAREERS),'Other'];
  const dots=`<div class="pips" style="max-width:140px" role="img" aria-label="Step ${Math.min(st,3)+1} of 4">${[0,1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  const nav=(label='Continue')=>`<div class="row"><button class="btn" data-act="obnext">${label}</button>${st?`<button class="btn ghost" data-act="obback">Back</button>`:''}</div>`;
  const err=o.err?`<p class="err" role="alert">${o.err}</p>`:'';
  let body;
  if(st===0)body=`${dots}<h1 tabindex="-1">What’s your name?</h1><input class="big" id="ob-name" type="text" autocomplete="given-name" placeholder="Your name" value="${esc(o.name)}" aria-label="Your name">${err}${nav()}`;
  else if(st===1)body=`${dots}<h1 tabindex="-1">What career are you working toward, ${esc(o.name.split(' ')[0])}?</h1>
   <div class="chips">${names.map(n=>`<button class="chip" data-act="obset" data-k="career" data-v="${n}" aria-pressed="${o.career===n}"><b>${n}</b><span>${n==='Other'?'Type your own':careerData(n).focus}</span></button>`).join('')}</div>
   ${o.career==='Other'?`<input class="big" id="ob-other" type="text" placeholder="Career name" value="${esc(o.other)}" aria-label="Career name">`:''}${err}${nav()}`;
  else if(st===2)body=`${dots}<h1 tabindex="-1">Where are you right now?</h1><p class="lede">This sets your starting levels. They are marked <b>self-reported / unverified</b> until you add evidence.</p>
   <div class="chips">${STAGES.map((x,i)=>`<button class="chip" data-act="obset" data-k="stage" data-v="${i}" aria-pressed="${o.stage===i}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div>${err}${nav()}`;
  else if(st===3)body=`${dots}<h1 tabindex="-1">What’s your goal?</h1>
   <div class="chips">${GOALS.map((x,i)=>`<button class="chip" data-act="obset" data-k="goal" data-v="${i}" aria-pressed="${o.goal===i}"><b>${x[0]}</b></button>`).join('')}</div>${err}${nav('Build My Skill Path')}`;
  else body=`<div class="pulse"></div><h1 tabindex="-1">Building your skill path</h1><div class="think" role="status"><span>Reading what ${esc(o.career==='Other'?o.other:o.career)} roles require</span><span>Placing your self-reported levels on the map</span><span>Choosing your first action</span></div>`;
  return `<div class="onb"><header class="land-top"><div class="brand">${LOGO}<span>Skill Loop</span></div><button class="link" data-act="home">Exit</button></header><div class="onb-body"><div class="onb-card">${body}</div></div></div>`}

function Today(){
  const a=nextAction(),r=ready(),n=S.skills.length,act=S.active&&actById(S.active.id),fl=S.flash;S.flash=null;
  const cur=act||a,s=cur&&sk(cur.skill),hr=new Date().getHours(),gaps=gapsSorted();
  const allDone=act&&S.active.checks.every(Boolean),stage=!cur?4:act?(allDone?2:1):(s.level<2&&cur.to===2?0:1);
  const loop=[['Learn','Understand what the skill needs'],['Build',act?`${S.active.checks.filter(Boolean).length} of ${cur.steps.length} criteria done`:'Do the work'],['Prove','Add it as evidence'],['Improve','Reassess and pick the next gap']];
  const strong=[...S.skills].sort((x,y)=>atT(y)-atT(x)||y.level-x.level||gapN(x)-gapN(y)).slice(0,3);
  const status=x=>atT(x)?'✓ Target met':x.unv?'Self-reported, unverified':`${gapN(x)} level${gapN(x)>1?'s':''} to ${L[x.target]}`;
  const evn=x=>{const e=evOf(x.id),v=e.filter(y=>y.verified).length,u=e.length-v;return `${v} evidence${u?` +${u} unverified`:''}`};
  if(fl&&sk(fl.skill)){const f=sk(fl.skill);setTimeout(()=>toast(`${f.name}: ${L[fl.before]} → ${L[f.level]}. ${STMSG[f.level]}.`),500)}
  return `<div class="col wide">
  <header class="head"><div class="eyebrow">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · Dashboard</div><h1 tabindex="-1">Good ${hr<12?'morning':hr<17?'afternoon':'evening'}, ${esc(first())}.</h1><p class="lede">Target: <b>${esc(S.profile.career)}</b> · ${GOALS[S.profile.goal][0]}</p></header>
  <section class="dready" aria-label="Readiness summary"><div class="num">${Roll(fl?fl.rb:null,r)}<small> of ${n}</small></div>
    <div style="display:grid;gap:4px"><p style="font-size:17px">${r} of ${n} required skills are currently at target.</p><p class="hint">${gaps.length?`${gaps.length} skill${gaps.length>1?'s':''} need${gaps.length>1?'':'s'} attention${gaps[0]?`. Biggest gap: ${gaps[0].name}`:''}.`:'Nothing needs attention.'}${S.evidence.length?'':' Levels are self-reported until you add evidence.'}</p></div>
    <div style="display:grid;gap:8px"><div class="pips" role="img" aria-label="${r} of ${n} skills at target">${S.skills.map(x=>`<i class="${atT(x)?'on':''}" title="${x.name}: ${status(x)}"></i>`).join('')}</div>
     <details class="why" style="border:0;padding:0"><summary style="font-size:13px;font-weight:500;color:var(--ink2)">Why am I seeing this?</summary><div style="padding-top:10px;display:grid;gap:8px"><p class="hint">A skill counts when its level meets the target for ${esc(S.profile.career)} and verified evidence supports it. No percentages, no hidden weights.</p>
     <div class="list">${S.skills.map(x=>`<div class="item" style="padding:7px 0"><span>${x.name}</span><span class="tag ${atT(x)?'on':''}">${atT(x)?'Counts':x.unv?'Unverified':'Below target'}</span><span class="sub">${conf(x)[0]} confidence</span></div>`).join('')}</div></div></details></div></section>
  <div class="dmain">
   <section class="sec"><div class="sec-h"><h2>Your skill level</h2><button class="link" data-act="go" data-v="map">Open Skill Map</button></div>
    <div><div class="dscale" aria-hidden="true"><span></span><div class="gb-scale">${[1,2,3,4].map(i=>`<span>${L[i]}</span>`).join('')}</div><span></span><span></span></div>
    ${S.skills.map(x=>`<button class="drow ${fl&&fl.skill===x.id?'flash':''}" data-act="skill" data-id="${x.id}"><span><span class="nm">${x.name}</span><span class="sub">${x.imp}</span></span>${GapBar(x,{fresh:fl&&fl.skill===x.id?fl.before:null})}<span class="lv"><b>${L[x.level]}</b> → ${L[x.target]}<br><span class="sub">${status(x)}</span></span><span class="ev sub">${evn(x)}</span></button>`).join('')}</div>
    ${Legend()}</section>
   ${cur?`<section class="hero" aria-labelledby="nba">
    <div class="row" style="justify-content:space-between"><span class="eyebrow" id="nba">Your next best action</span>${act?'<span class="tag on">In progress</span>':'<span class="eyebrow ai">Skill Loop Intelligence</span>'}</div>
    <h2>${esc(cur.title)}</h2>
    <p class="lede">${esc(cur.reason)}</p>
    <dl class="facts"><div><dt>Expected skill progression</dt><dd>${s.name}: ${s.unv&&s.level>=cur.to?L[cur.to]+', verified':L[s.level]+' → '+L[cur.to]}</dd></div><div><dt>Evidence it will create</dt><dd>${cur.produces}</dd></div><div><dt>Estimated effort</dt><dd>${cur.time}</dd></div></dl>
    <details class="why"><summary>Why this, why now?</summary><div class="whys">${cur.why.map(w=>`<div><span class="k">${w[0]}</span><p>${esc(w[1])}</p></div>`).join('')}</div></details>
    ${S.skipAsk===cur.id?`<div class="panel"><b>Why are you skipping this?</b><div class="row">${['No time this week','Already working on it elsewhere','Not relevant to my goal'].map(x=>`<button class="btn ghost" data-act="skipdo" data-id="${cur.id}" data-v="${x}">${x}</button>`).join('')}<button class="link" data-act="skipcancel">Keep this action</button></div></div>`:
    `<div class="row">${act?`<button class="btn" data-act="go" data-v="progress">Continue action</button>`:`<button class="btn" data-act="brief" data-id="${cur.id}">Start action</button><button class="link" data-act="skipask" data-id="${cur.id}">Swap for another action</button>`}</div>`}
   </section>`:`<section class="hero"><span class="eyebrow">Target reached</span><h2>Every required skill is at its target level, backed by evidence.</h2><p class="lede">Keep your evidence current, or compare another career on the Career page.</p><div class="row"><button class="btn" data-act="go" data-v="career">Open Career</button></div></section>`}
  </div>
  <div class="dthree">
   <section class="sec b"><div class="sec-h"><h2>Biggest gaps</h2><span class="hint">${Math.min(3,gaps.length)} of ${gaps.length}</span></div>
    ${gaps.length?`<div class="list">${gaps.slice(0,3).map((g,i)=>`<button class="item" data-act="skill" data-id="${g.id}"><span><span class="sub" style="font-size:12px">0${i+1}</span> <span class="nm">${g.name}</span></span><span class="tag ${g.imp==='Critical'?'crit':''}">${g.imp} gap</span><span class="sub">${L[g.level]}${g.unv?' (self-reported)':''} → ${L[g.target]} · ${evn(g)}</span></button>`).join('')}</div>`:`<div class="empty"><b>No gaps.</b><span>Every required skill is at target.</span></div>`}</section>
   <section class="sec a"><div class="sec-h"><h2>Strongest skills</h2></div>
    <div class="list">${strong.map(x=>`<button class="item" data-act="skill" data-id="${x.id}"><span class="nm">${x.name}</span><span class="tag ${atT(x)?'on':''}">${L[x.level]}</span><span class="sub">${status(x)} · ${evn(x)}</span></button>`).join('')}</div></section>
   <section class="sec c"><div class="sec-h"><h2>Recent progress</h2><span class="hint">${S.evidence.length} evidence item${S.evidence.length===1?'':'s'}</span></div>
    ${S.history.length?`<div class="list">${[...S.history].reverse().slice(0,4).map(h=>`<div class="item"><span>${esc(h.text)}</span><span class="sub" style="grid-column:2;grid-row:1">${fmt(h.date)}</span><span class="sub">${esc(h.why)}</span></div>`).join('')}</div>`:`<div class="empty"><b>No reassessments yet.</b><span>Complete your first action and add evidence. Each change to a skill level is recorded here.</span></div>`}</section>
  </div>
  <section class="sec"><div class="sec-h"><h2>Your Skill Loop</h2><span class="hint">${cur?esc(s.name):'Complete'}</span></div>
    <div class="loop">${loop.map((x,i)=>`<div class="${i<stage?'done':i===stage?'now':''}"><b>${x[0]}</b><span>${i<stage?'Done':i===stage?'Current stage · '+x[1]:x[1]}</span></div>`).join('')}</div></section>
  </div>`}

function SkillMap(){
  let rows=[...S.skills];
  if(S.filter==='attention')rows=rows.filter(s=>!atT(s));
  if(S.filter==='target')rows=rows.filter(atT);
  const cmpf={gap:(a,b)=>gapN(b)-gapN(a)||IMP[a.imp]-IMP[b.imp],recent:(a,b)=>b.changed-a.changed,evidence:(a,b)=>evOf(a.id).length-evOf(b.id).length,importance:(a,b)=>IMP[a.imp]-IMP[b.imp]||gapN(b)-gapN(a)};
  rows.sort(cmpf[S.sort]);
  const seg=(k,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="set" data-k="${k}" data-v="${v}" aria-pressed="${S[k]===v}">${l}</button>`).join('')}</div>`;
  const top=gapsSorted().slice(0,3);
  return `<div class="col">
  <header class="head"><div class="eyebrow">Target: ${esc(S.profile.career)}</div><h1 tabindex="-1">Skill Map</h1><p class="lede">${ready()} of ${S.skills.length} required skills are at their target level.${top.length?` Top priorit${top.length>1?'ies':'y'}: ${top.map(t=>t.name).join(', ')}.`:''}</p></header>
  <section class="sec">
   <div class="ctrl"><div class="row"><span class="k">Sort</span>${seg('sort',[['importance','Importance'],['gap','Gap size'],['recent','Recent progress'],['evidence','Least evidence']])}</div>
   <div class="row"><span class="k">Filter</span>${seg('filter',[['all','All'],['attention','Needs attention'],['target','At target']])}</div></div>
   <div><div class="lhead"><span>Skill</span><span>Importance</span><span>Level and evidence</span><span>Current</span><span>Target</span><span>Evidence</span><span></span></div>
   ${rows.length?rows.map(s=>`<button class="lrow" data-act="skill" data-id="${s.id}">
     <span><span class="nm">${s.name}</span><span class="sub m">${L[s.level]}${s.unv?' (self-reported)':''} → ${L[s.target]} · ${evOf(s.id).length} evidence</span></span>
     <span>${impTag(s)}</span>${GapBar(s)}
     <span class="d">${L[s.level]}${s.unv?'<br><span class="sub">self-reported</span>':''}</span><span class="d">${L[s.target]}${atT(s)?'<br><span class="sub">✓ met</span>':''}</span><span class="d">${evCount(s.id)}</span><span class="chev d" aria-hidden="true">›</span></button>`).join(''):`<div class="empty" style="margin-top:20px"><b>${S.filter==='target'?'No skills at target yet.':'Nothing needs attention.'}</b><span>${S.filter==='target'?'A skill appears here once its level meets the target and evidence supports it.':'Every required skill is at target.'}</span></div>`}</div>
   ${Legend()}
  </section></div>`}

function explain(s){
  const ev=evOf(s.id),top=Math.max(-1,...ev.filter(e=>e.verified).map(e=>e.strength)),g=gapN(s);
  if(s.unv)return `You rated yourself ${L[s.level]}. That is a starting point, not yet an assessment. Add evidence and Skill Loop will confirm or adjust the level.`;
  if(g<=0)return `This skill is at its target level. Your strongest evidence is ${STR[Math.max(top,0)].toLowerCase()}, which supports ${L[s.level]}.`;
  const shows=['self-reported activity','learning activity','applied project work','reviewed work'][Math.max(top,0)];
  const need=s.level+1>=4?'independently reviewed work':s.level+1===3?'substantial applied project':'completed course or assessment';
  return `You’re ${g===1?'one level':g+' levels'} below the target because your evidence currently shows ${shows} but no ${need}.`}
function Skill(){
  const s=sk(S.skillId),ev=evOf(s.id),a=actionFor(s),act=S.active&&S.active.id===a?.id,c=conf(s);
  return `<div class="col">
  <button class="back" data-act="go" data-v="map">← Skill Map</button>
  <header class="head"><div class="row">${impTag(s)}<span class="eyebrow">Required for ${esc(S.profile.career)}</span></div><h1 tabindex="-1">${s.name}</h1></header>
  <section class="sec"><div class="kv"><div><span class="k">Current</span><span class="v">${L[s.level]}${s.unv?' <span class="tag">Self-reported</span>':''}</span></div><div><span class="k">Target</span><span class="v">${L[s.target]}</span></div><div><span class="k">Confidence</span><span class="v">${c[0]}</span><span class="hint">${c[1]}</span></div><div><span class="k">Evidence</span><span class="v">${ev.length} item${ev.length===1?'':'s'}</span><span class="hint">${ev.length?'Strongest: '+STR[Math.max(...ev.map(e=>e.strength))]:'None yet'}</span></div></div>
   ${GapBar(s,{scale:1})}${Legend()}<p class="note">${explain(s)}</p></section>
  ${atT(s)?`<section class="panel ok"><span class="eyebrow">Target reached</span><p class="serif" style="font-size:22px">${s.name} meets the ${L[s.target]} target for ${esc(S.profile.career)}.</p><p class="hint">It counts toward your readiness. Add newer evidence when you have it to keep this current.</p></section>`:''}
  <section class="sec"><div class="sec-h"><h2>Evidence ledger</h2><button class="link" data-act="add" data-id="${s.id}">+ Add evidence</button></div>
   <div class="ledger"><div class="sec" style="gap:8px"><span class="eyebrow">Evidence you have</span>
    ${ev.length?`<div class="list">${ev.map(e=>`<div class="item"><span>${esc(e.title)}</span>${strTag(e)}<span class="sub">${e.type} · ${fmt(e.date)}</span></div>`).join('')}</div>`:`<div class="empty"><b>No evidence yet.</b><span>Your ${L[s.level]} level is self-reported. One piece of evidence turns it into an assessment.</span></div>`}</div>
   <div class="sec" style="gap:8px"><span class="eyebrow">Evidence you still need</span>
    ${a?`<div class="list"><button class="item" data-act="${act?'go':'brief'}" data-v="progress" data-id="${a.id}"><span>${esc(a.missing)}</span><span class="tag miss">Missing</span><span class="sub">Needed for ${L[a.to]} · opens the action ›</span></button>
     ${a.to<s.target?`<div class="item"><span style="color:var(--ink3)">Reviewed work</span><span class="tag miss">Later</span><span class="sub">Needed for ${L[s.target]}</span></div>`:''}</div>`:`<div class="empty"><b>Nothing missing.</b><span>Your evidence supports the target level.</span></div>`}</div></div>
   <p class="hint">Evidence strength maps to skill level: Self-reported → Aware, Completed → Practised, Built → Applied, Reviewed → Proven. Completing a course is not the same as proving competence.</p></section>
  ${a?`<section class="sec"><div class="sec-h"><h2>Recommended action</h2><span class="eyebrow ai">Skill Loop Intelligence</span></div><p class="serif" style="font-size:24px">${esc(a.title)}.</p><p class="lede"><b>What you’re missing:</b> ${esc(a.missing.toLowerCase())}. ${esc(a.why[2][1])}</p><p class="hint">${a.time} · ${s.name} → ${L[a.to]}</p>
   <div class="row"><button class="btn" data-act="${act?'go':'brief'}" data-v="progress" data-id="${a.id}">${act?'Continue action':'View action'}</button></div></section>`:''}
  </div>`}

function Brief(){
  const a=actById(S.briefId),s=sk(a.skill);
  return `<div class="col narrow">
  <header class="head"><div class="eyebrow">Action brief · ${s.name} · ${s.imp}</div><h1 tabindex="-1">${esc(a.title)}</h1><p class="lede"><b>Objective:</b> produce ${a.produces.toLowerCase()} that shows ${s.name} at ${L[a.to]}.</p></header>
  <section class="sec"><div class="sec-h"><h2>Why this, why now?</h2><span class="eyebrow ai">Skill Loop Intelligence</span></div><div class="whys" style="padding:0">${a.why.map(w=>`<div><span class="k">${w[0]}</span><p>${esc(w[1])}</p></div>`).join('')}</div>${GapBar(s,{scale:1})}</section>
  <section class="sec"><div class="sec-h"><h2>Done when</h2><span class="hint">${a.steps.length} criteria</span></div><div class="list">${a.steps.map(x=>`<div class="check static"><input type="checkbox" disabled aria-hidden="true"><span>${esc(x)}</span></div>`).join('')}</div></section>
  <section class="kv"><div><span class="k">Evidence this creates</span><span class="v">${STR[a.strength]} ${a.evType.toLowerCase()}</span></div><div><span class="k">Expected skill change</span><span class="v">${s.unv&&s.level>=a.to?L[a.to]+', verified':L[s.level]+' → '+L[a.to]}</span></div><div><span class="k">Estimated time</span><span class="v">${a.time}</span></div><div><span class="k">Importance</span><span class="v">${s.imp}</span></div></section>
  <div class="row"><button class="btn" data-act="start" data-id="${a.id}">Start building</button><button class="btn ghost" data-act="skipask" data-id="${a.id}">Skip for now</button></div></div>`}

function Progress(){
  const a=actById(S.active.id),s=sk(a.skill),c=S.active.checks,d=c.filter(Boolean).length,n=a.steps.length;
  return `<div class="col narrow">
  <header class="head"><div class="row"><span class="tag on">In progress</span><span class="eyebrow">${s.name} · ${L[s.level]} → ${L[a.to]}</span></div><h1 tabindex="-1">${esc(a.title)}</h1></header>
  <section class="sec"><div class="row" style="justify-content:space-between"><b id="pc">${d} of ${n} criteria done</b><span class="hint">Estimated ${a.time}</span></div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${d}" aria-label="Criteria done"><i id="pb" style="width:${d/n*100}%"></i></div></section>
  <section class="sec"><div class="sec-h"><h2>Checklist</h2></div><div class="list">${a.steps.map((x,i)=>`<label class="check"><input type="checkbox" id="ck${i}" data-i="${i}" ${c[i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div></section>
  <section class="sec field"><label for="notes" class="serif" style="font-size:24px;font-weight:400">Notes</label><textarea id="notes" placeholder="Decisions, blockers, things to mention in the write-up">${esc(S.active.notes)}</textarea><span class="hint">Notes are carried into your evidence description.</span></section>
  <div class="row"><button class="btn" data-act="add" data-id="${s.id}" data-a="${a.id}">Add evidence</button><span class="hint" id="ph">${d<n?'You can add evidence before every criterion is ticked.':'All criteria met. Add your work as evidence.'}</span></div></div>`}

function Add(){
  const c=S.addCtx,a=c.action&&actById(c.action),st=a?a.strength:2;
  const desc=a?(S.active&&S.active.id===a.id&&S.active.notes?S.active.notes:a.desc):'';
  const radios=(name,opts,sel)=>`<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" id="${name}-${v}" value="${v}" ${v==sel?'checked':''}>${l}</label>`).join('')}</div>`;
  return `<div class="col narrow">
  <header class="head"><div class="eyebrow">Takes under a minute</div><h1 tabindex="-1">Add evidence</h1>${a?`<p class="lede">Prefilled from your action. Check the details and submit.</p>`:''}</header>
  <form id="evform" class="sec" style="gap:24px" novalidate>
   <div class="field"><label for="f-title">Title</label><input type="text" id="f-title" value="${esc(a?a.evTitle:'')}" placeholder="What did you make or complete?"><p class="err" id="e-title" hidden>Add a title so this evidence can be recognised later.</p></div>
   <div class="field"><span class="lab">Evidence type</span>${radios('type',['Project','Course','Assessment','Other'].map(x=>[x,x]),a?a.evType:'Project')}</div>
   <div class="two"><div class="field"><label for="f-link">Link</label><input type="url" id="f-link" placeholder="https://" value="${esc(a?.link||'')}"><p class="err" id="e-link" hidden>That doesn’t look like a link. Start with https://, or leave it empty.</p></div>
    <div class="field"><label for="f-file">Or upload a file</label><input type="file" id="f-file"><span class="hint" id="h-file">PDF, image or document, up to 5 MB.</span></div></div>
   <div class="panel" id="e-file" hidden role="alert"><b>Upload failed</b><span id="e-file-msg" class="hint"></span><div class="row"><button type="button" class="btn ghost" data-act="retryfile">Choose another file</button><span class="hint">Or paste a link instead. Nothing you typed was lost.</span></div></div>
   <div class="field"><label for="f-skill">Linked skill</label><select id="f-skill">${S.skills.map(s=>`<option value="${s.id}" ${s.id===c.skill?'selected':''}>${s.name}</option>`).join('')}</select></div>
   <div class="field"><label for="f-desc">Short description</label><textarea id="f-desc" placeholder="One or two sentences on what it shows">${esc(desc)}</textarea></div>
   <div class="field"><span class="lab">Evidence strength</span>${radios('str',[[1,'Completed'],[2,'Built'],[3,'Reviewed']],st)}<span class="hint">Completed: you finished a course or test. Built: you made something yourself. Reviewed: someone qualified checked it.</span></div>
   <div class="row"><button class="btn" type="submit" id="f-sub">Submit evidence</button><span class="hint">Skill Loop reassesses the linked skill straight away.</span></div>
  </form></div>`}

function Assessing(){const s=sk(S.result.skill);return `<div class="col narrow" style="padding-top:8vh"><div class="pulse"></div><h1 tabindex="-1">Reassessing ${s.name}</h1><div class="think" role="status"><span>Evidence recorded</span><span>Comparing its strength with the ${L[s.target]} target</span><span>Updating readiness and your next action</span></div></div>`}

function Result(){
  const r=S.result,s=sk(r.skill),a=nextAction(),n=S.skills.length,ev=S.evidence[r.evIdx];
  const before={...s,level:r.before,unv:r.wasUnv};
  const head=r.kind==='up'?`${s.name} moved from ${L[r.before]} to ${L[r.after]}.`:r.kind==='confirmed'?`${s.name} is confirmed at ${L[r.after]}.`:`${s.name} stays at ${L[r.after]}.`;
  const why=r.kind==='up'?(atT(s)?`Your new evidence demonstrates practical ${ev.strength===3?'and reviewed ':''}application of ${s.name}, moving this skill to the target level.`:`Your new evidence moves ${s.name} up to ${L[r.after]}. ${gapN(s)===1?'One level remains':gapN(s)+' levels remain'} before the ${L[s.target]} target.`)
   :r.kind==='confirmed'?`Your ${STR[ev.strength].toLowerCase()} evidence backs the level you reported. ${s.name} is no longer self-reported.`
   :`The evidence is saved, but “${STR[ev.strength]}” evidence does not show more than ${L[r.after]}. ${L[Math.min(4,r.after+1)]} needs ${r.after+1>=4?'reviewed':'built'} evidence.`;
  const left=S.skills.filter(x=>!atT(x)&&x.imp==='Critical').length;
  return `<div class="col narrow">
  <header class="head"><div class="eyebrow">Reassessment · evidence accepted</div><h1 tabindex="-1">${head}</h1></header>
  <section class="sec">${Stairs({level:r.after,target:s.target,fresh:r.kind==='up'?r.before:null,cls:'sm'})}${r.kind!=='same'?`<p class="stmsg"><b>${r.kind==='up'?STMSG[r.after]:'Level confirmed'}</b> <span class="hint">\u00B7 +1 ${STR[ev.strength].toLowerCase()} ${ev.type.toLowerCase()} \u00B7 ${evOf(s.id).length} evidence items for ${s.name}</span></p>`:''}</section>
  <section class="ba"><div><span class="eyebrow">Before</span><span class="k">${s.name}</span><span class="lv" style="color:var(--ink3)">${L[r.before]}</span>${GapBar(before,{ev:evOf(s.id).filter(e=>e!==ev),cap:1})}</div>
   <div class="arrow" aria-hidden="true">→</div>
   <div><span class="eyebrow">After</span><span class="k">${s.name}</span><span class="lv">${L[r.after]}</span>${GapBar(s,{fresh:r.kind==='up'?r.before:null,cap:1})}</div></section>
  <p class="note">${why}</p>
  <section class="sec"><div class="sec-h"><h2>Readiness</h2></div><div class="kv"><div><span class="k">Before</span><span class="v" style="color:var(--ink3)">${r.readyBefore} of ${n} skills at target</span></div><div><span class="k">After</span><span class="v">${Roll(r.readyBefore,r.readyAfter)} of ${n} skills at target</span></div></div>
   <div class="pips" aria-hidden="true">${S.skills.map(x=>`<i class="${atT(x)?'on':''}"></i>`).join('')}</div>
   <p class="hint">${left?`${left===1?'One critical gap remains':left+' critical gaps remain'} before your target.`:'No critical gaps remain.'} Evidence for ${s.name}: ${evOf(s.id).length} items.</p></section>
  <section class="sec"><div class="sec-h"><h2>Your next action</h2><span class="eyebrow ai">Skill Loop Intelligence</span></div>${a?`<p class="serif" style="font-size:24px">${esc(a.title)}.</p><p class="lede">${esc(a.reason)}</p>`:`<p class="serif" style="font-size:24px">Every required skill is at target.</p>`}
   <div class="row"><button class="btn" data-act="go" data-v="today">Back to Dashboard</button><button class="btn ghost" data-act="go" data-v="map">See Skill Map</button></div></section></div>`}

function Evidence(){
  const tab=(v,l)=>`<button data-act="set" data-k="evTab" data-v="${v}" aria-pressed="${S.evTab===v}">${l}</button>`;
  const proj=S.evidence.filter(e=>e.strength>=2).reverse(),cnt=i=>S.evidence.filter(e=>e.strength===i).length;
  if(!S.evidence.length)return `<div class="col"><header class="head"><div class="eyebrow">What have you actually proved?</div><h1 tabindex="-1">Evidence</h1></header>
   <div class="empty" style="padding:36px"><b>No evidence yet.</b><span style="max-width:52ch">Your skill levels are self-reported for now. Add a course, an assessment or a project and Skill Loop will place it under the level it supports.</span><div class="row" style="margin-top:10px"><button class="btn" data-act="add">+ Add evidence</button><button class="btn ghost" data-act="go" data-v="today">See my next action</button></div></div></div>`;
  return `<div class="col">
  <header class="head"><div class="eyebrow">What have you actually proved?</div><h1 tabindex="-1">Evidence</h1><p class="lede">${S.evidence.length} items. ${cnt(3)} reviewed, ${cnt(2)} built, ${cnt(1)} completed${cnt(0)?`, ${cnt(0)} self-reported`:''}. Each one is linked to a skill and graded by strength.</p></header>
  <div class="row" style="justify-content:space-between"><div class="seg" role="group">${tab('library','Library')}${tab('portfolio','Portfolio view')}</div><button class="btn" data-act="add">+ Add evidence</button></div>
  ${S.evTab==='library'?S.skills.map(s=>`<section class="sec"><div class="sec-h"><h2><button data-act="skill" data-id="${s.id}" style="font:inherit">${s.name}</button></h2><span class="hint">${L[s.level]}${s.unv?', self-reported':''} · ${evOf(s.id).length} item${evOf(s.id).length===1?'':'s'}</span></div>
    ${evOf(s.id).length?`<div class="list">${evOf(s.id).map(e=>`<div class="item"><span>${esc(e.title)}</span>${strTag(e)}<span class="sub">${e.type} · ${fmt(e.date)} · ${e.strength===3?'Reviewed':e.verified?'Verified':'Awaiting proof'}</span></div>`).join('')}</div>`:`<p class="hint">No evidence yet. <button class="link" data-act="add" data-id="${s.id}">Add the first item</button></p>`}</section>`).join('')
  :proj.length?`<section><p class="hint" style="padding-bottom:8px;border-bottom:1px solid var(--ink3)">Built and reviewed work, newest first. This is the view you would share with a recruiter.</p>
    ${proj.map((e,i)=>`<article class="plate"><span class="no">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(e.title)}</h3><p style="color:var(--ink2);max-width:58ch">${esc(e.desc||'No description added.')}</p><div class="row"><span class="tag crit">${sk(e.skill)?.name||'Earlier target'}</span>${strTag(e)}<span class="hint">${fmt(e.date)}</span></div></div></article>`).join('')}</section>`
   :`<div class="empty"><b>Nothing built yet.</b><span>The portfolio view shows built and reviewed work only. Courses and assessments stay in the library.</span></div>`}
  </div>`}

function makePlan(){
  const g=gapsSorted(),a1=g[0]&&actionFor(g[0]),a2=g[1]&&actionFor(g[1]),c=S.profile.career;
  if(!a1)return null;
  const s1=g[0].name;
  return{career:c,made:Date.now(),focus:careerData(c).focus,weeks:[
   ['Week 1','Build fundamentals',[`Read three ${c} job descriptions and note what they ask for in ${s1}`,`Refresh the basics of ${s1}`,a2?`Skim what ${g[1].name} at ${L[g[1].target]} looks like`:'List the tools you will need']],
   ['Week 2','Complete a practical task',[cap(a1.steps[0]),cap(a1.steps[1]),'Note what was harder than expected']],
   ['Week 3','Build a portfolio project',[a1.title,...a1.steps.slice(2,4).map(cap)]],
   ['Week 4','Document and prove',['Write up the problem, approach and result','Add it as evidence and reassess '+s1,GOALS[S.profile.goal][1]]]]}}
function Career(){
  const c=S.profile.career,d=careerData(c),top=gapsSorted().slice(0,3),a=nextAction(),others=Object.keys(CAREERS).filter(n=>n!==c);
  const o=S.cmp&&careerData(S.cmp),mine=S.skills.map(s=>s.name);
  const oFit=o&&o.skills.filter(p=>{const m=S.skills.find(s=>s.name===p[0]);return m&&m.level>=p[2]&&!m.unv}).length;
  return `<div class="col">
  <header class="head"><div class="eyebrow">Target career</div><h1 tabindex="-1">${esc(c)}</h1><p class="lede">${esc(d.desc)}</p></header>
  <section class="sec"><div class="sec-h"><h2>Your career plan</h2><span class="eyebrow ai">Skill Loop Intelligence</span></div>
   <div class="kv"><div><span class="k">Your current focus</span><span class="v">${esc(d.focus)}</span></div><div><span class="k">Goal</span><span class="v">${GOALS[S.profile.goal][0]}</span></div></div>
   <div class="cmp"><div><span class="eyebrow">Priority skills</span><ul>${(top.length?top:S.skills.slice(0,3)).map((s,i)=>`<li>${i+1}. ${s.name} <span class="sub">${s.imp}</span></li>`).join('')}</ul></div>
   <div><span class="eyebrow">Evidence you could produce</span><ul>${(a?a.parts:['Newer reviewed work']).map(p=>`<li>${cap(p)}</li>`).join('')}</ul></div></div>
   ${S.planBusy?`<div class="panel"><div class="row"><div class="pulse"></div><div class="think" role="status"><span>Reading your skill map</span><span>Ordering gaps by importance and effort</span><span>Fitting actions into four weeks</span></div></div></div>`
   :S.plan&&S.plan.career===c?`<div class="sec" style="gap:14px"><div class="row" style="justify-content:space-between"><h3 class="serif" style="font-size:24px;font-weight:400">30-Day Skill Plan</h3><button class="link" data-act="plan">Regenerate</button></div>
     <div class="weeks">${S.plan.weeks.map(w=>`<div><span class="eyebrow">${w[0]}</span><b>${w[1]}</b><ul class="plain" style="font-size:13.5px">${w[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>
     <p class="hint">Prototype intelligence: this plan is assembled on your device from Skill Loop’s career data and your current gaps. A production version would use a language model to tailor it further.</p></div>`
   :a?`<div class="row"><button class="btn" data-act="plan">Generate My Plan</button><span class="hint">A 30-day plan built from your gaps, goal and current level.</span></div>`:`<p class="hint">All skills are at target, so there is nothing to plan.</p>`}</section>
  <section class="sec"><div class="sec-h"><h2>What this career requires</h2><span class="hint">${ready()} of ${S.skills.length} at target</span></div>
   <div style="overflow-x:auto"><table><thead><tr><th>Skill</th><th>Importance</th><th>You need</th><th>You have</th></tr></thead><tbody>
   ${S.skills.map(s=>`<tr><td class="s"><button data-act="skill" data-id="${s.id}" style="font:inherit">${s.name}</button></td><td>${impTag(s)}</td><td>${L[s.target]}</td><td>${L[s.level]} <span class="hint">${atT(s)?'✓ met':s.unv?'self-reported':'below'}</span></td></tr>`).join('')}</tbody></table></div>
   <p class="hint">Critical skills are screened for in most entry-level ${esc(c)} roles. Important skills strengthen an application but rarely decide it alone.</p></section>
  <section class="sec"><div class="sec-h"><h2>Compare another career</h2><span class="hint">Optional</span></div>
   <div class="row"><label for="cmp" class="k">Compare ${esc(c)} with</label><select id="cmp" class="sel" style="width:auto"><option value="">Choose a career</option>${others.map(n=>`<option ${S.cmp===n?'selected':''}>${n}</option>`).join('')}</select></div>
   ${o?`<div class="cmp" style="animation:in .3s both"><div><span class="k">Current fit, ${esc(c)}</span><div class="serif" style="font-size:26px">${ready()} of ${S.skills.length} at target</div></div><div><span class="k">Current fit, ${S.cmp}</span><div class="serif" style="font-size:26px">${oFit} of ${o.skills.length} at target</div></div>
    <div><span class="eyebrow">Shared skills</span><ul>${o.skills.filter(p=>mine.includes(p[0])).map(p=>`<li>${p[0]} <span class="sub">needs ${L[p[2]]}</span></li>`).join('')||'<li>None</li>'}</ul></div>
    <div><span class="eyebrow">Only in ${S.cmp}</span><ul>${o.skills.filter(p=>!mine.includes(p[0])).map(p=>`<li>${p[0]} <span class="sub">${p[1]}, needs ${L[p[2]]}</span></li>`).join('')}</ul></div>
    <div><span class="eyebrow">Only in ${esc(c)}</span><ul>${S.skills.filter(s=>!o.skills.some(p=>p[0]===s.name)).map(s=>`<li>${s.name}</li>`).join('')||'<li>None</li>'}</ul></div>
    <div><span class="eyebrow">Your current gaps, ${esc(c)}</span><ul>${gapsSorted().map(g=>`<li>${g.name}: ${L[g.level]} → ${L[g.target]}</li>`).join('')||'<li>None</li>'}</ul></div></div>
    <div class="row"><button class="btn ghost" data-act="switch" data-v="${S.cmp}">Change target to ${S.cmp}</button><span class="hint">Your evidence is kept. Shared skills carry over; new skills start as self-reported.</span></div>`:''}
  </section></div>`}

function Profile(){
  const p=S.profile;
  return `<div class="col narrow"><header class="head"><div class="eyebrow">${S.demo?'Demo account':'Your profile'}</div><h1 tabindex="-1">${esc(p.name)}</h1>${p.edu?`<p class="lede">${p.edu}</p>`:''}</header>
  <section class="kv"><div><span class="k">Target career</span><span class="v">${esc(p.career)}</span></div><div><span class="k">Goal</span><span class="v">${GOALS[p.goal][0]}</span></div><div><span class="k">Starting point</span><span class="v">${STAGES[p.stage][0]}</span></div><div><span class="k">Readiness</span><span class="v">${ready()} of ${S.skills.length} at target</span></div></section>
  <section class="sec"><div class="sec-h"><h2>Settings</h2></div>
   <div class="list"><div class="item"><span>${S.demo?'Reset demo':'Reset experience'}</span><button class="btn ghost" data-act="reset" style="grid-column:2;grid-row:1/3">${S.demo?'Reset demo':'Start over'}</button><span class="sub">${S.demo?'Restores Omkar’s account to its starting state so the walkthrough can be repeated.':'Clears your profile, skills and evidence from this browser.'}</span></div>
   <div class="item"><span>Change career target</span><button class="btn ghost" data-act="go" data-v="career" style="grid-column:2;grid-row:1/3">Open Career</button><span class="sub">Compare roles and switch from the Career page.</span></div>
   <div class="item"><span>Exit to landing page</span><button class="btn ghost" data-act="home" style="grid-column:2;grid-row:1/3">Exit</button><span class="sub">Your data stays saved in this browser.</span></div></div>
   <p class="hint">Skill Loop is a UX prototype. Everything is stored locally in your browser; nothing is sent to a server.</p></section></div>`}

const VIEWS={today:Today,map:SkillMap,skill:Skill,brief:Brief,progress:Progress,add:Add,assessing:Assessing,result:Result,evidence:Evidence,career:Career,profile:Profile};
const $=id=>document.getElementById(id);
const root=document.getElementById('root'),toast_=document.getElementById('toast');
function render(focus=true){
  save();
  if(S.mode==='landing'){root.innerHTML=Landing();bindLanding()}
  else if(S.mode==='onboarding')root.innerHTML=Onb();
  else{
    if(S.view==='progress'&&(!S.active||!actById(S.active.id))){S.active=null;S.view='today'}
    if(S.view==='brief'&&!actById(S.briefId))S.view='today';
    if(S.view==='skill'&&!sk(S.skillId))S.view='map';
    if((S.view==='result'||S.view==='assessing')&&!S.result)S.view='today';
    if(S.view==='add'&&!S.addCtx)S.view='evidence';
    const flow=FLOW.includes(S.view),cur=PARENT[S.view]||S.view;
    const nav=NAV.map(([v,l])=>`<button data-act="go" data-v="${v}" ${cur===v?'aria-current="page"':''}><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${ICON[v]}</svg>${l}</button>`).join('');
    const stepI={brief:0,progress:1,add:2,assessing:3,result:3}[S.view];
    const inAct=S.view==='add'?!!S.addCtx.action:true;
    root.innerHTML=flow?`<div class="flow"><header class="flowbar"><button class="back" data-act="go" data-v="${S.view==='add'&&!inAct?'evidence':'today'}">✕ ${S.view==='result'?'Back to Dashboard':'Exit'}</button>${inAct?`<ol class="steps" aria-label="Action steps">${['Brief','Build','Prove','Reassess'].map((x,i)=>`<li class="${i<stepI?'done':i===stepI?'now':''}">${x}</li>`).join('')}</ol>`:'<span class="hint">Add evidence</span>'}</header><main>${VIEWS[S.view]()}</main></div>`
    :`<div class="app"><aside class="rail"><div class="brand">${LOGO}<span>Skill Loop</span></div><nav class="nav" aria-label="Main">${nav}</nav>
      <button class="who" data-act="go" data-v="profile" aria-label="Profile and settings"><span class="av">${esc(initials())}</span><span class="wt"><span class="wn">${esc(S.profile.name)}</span><span>${S.demo?'Demo · ':''}${esc(S.profile.career)}</span></span></button></aside>
     <div><div class="topbar"><div class="brand">${LOGO}<span>Skill Loop</span></div><button class="av" data-act="go" data-v="profile" aria-label="Profile and settings">${esc(initials())}</button></div><main>${VIEWS[S.view]()}</main></div></div>
     <nav class="bottom" aria-label="Main">${nav}</nav>`;
  }
  if(focus){window.scrollTo(0,0);root.querySelector('h1')?.focus({preventScroll:true})}
}
const pinned=()=>matchMedia('(min-width:861px)').matches,reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function setTab(i){
  if(LS.tab===i&&$('pcap').dataset.i==i)return;LS.tab=i;
  document.querySelectorAll('.pv').forEach((e,j)=>e.classList.toggle('on',j===i));
  document.querySelectorAll('.btabs button').forEach((e,j)=>e.setAttribute('aria-selected',j===i));
  const c=$('pcap');c.dataset.i=i;c.innerHTML=`<b>${SCREENS[i][3]}</b><span class="hint">${SCREENS[i][4]}</span>`}
function setLoop(i){document.querySelectorAll('.lstage').forEach((e,j)=>e.classList.toggle('on',j===i));document.querySelectorAll('#lsticky .lpanel').forEach((e,j)=>e.classList.toggle('on',j===i))}
function fitPv(){
  const v=$('bview');if(!v)return;const mob=!pinned(),W=mob?390:1180,H=mob?700:700,k=v.clientWidth/W;
  v.style.height=Math.min(H*k,mob?9999:Math.max(260,innerHeight-250))+'px';
  v.querySelectorAll('.pv').forEach(e=>{e.style.width=W+'px';e.style.height=H+'px';e.style.transform=`scale(${k})`})}
function onScroll(){
  if(S.mode!=='landing'||!$('lnav'))return;const y=scrollY,vh=innerHeight,cl=x=>Math.max(0,Math.min(1,x));
  $('lnav').classList.toggle('compact',y>30);
  if(!reduced())$('stack').style.translate=`0 ${Math.min(y*.1,50)}px`;
  const f=$('flows'),r=f.getBoundingClientRect(),p=reduced()?1:cl((vh*.85-r.top)/(vh*.6));
  f.querySelectorAll('.flow-new .fstep').forEach((e,i)=>e.classList.toggle('on',p>(i+.5)/5.5));
  f.querySelector('.flow-old').classList.toggle('fade',p>.55);
  if(pinned()){const pr=$('product').getBoundingClientRect();if(pr.top<vh&&pr.bottom>0)setTab(Math.min(3,Math.floor(cl(-pr.top/(pr.height-vh))*4)))}}
function bindLanding(){
  landObs.forEach(o=>o.disconnect());landObs=[];
  const st=$('stage'),sk_=$('stack');
  if(!reduced()&&matchMedia('(hover:hover)').matches){
    const hero=$('top');
    hero.onpointermove=e=>{const r=hero.getBoundingClientRect();sk_.style.setProperty('--ty',((e.clientX-r.left)/r.width-.5)*12+'deg');sk_.style.setProperty('--tx',-((e.clientY-r.top)/r.height-.5)*9+'deg')};
    hero.onpointerleave=()=>{sk_.style.setProperty('--ty','0deg');sk_.style.setProperty('--tx','0deg')}}
  const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.15});
  document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
  const lo=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&pinned()&&setLoop(+x.target.dataset.i)),{rootMargin:'-45% 0px -45% 0px'});
  document.querySelectorAll('.lstage').forEach(x=>{lo.observe(x);x.onmouseenter=()=>pinned()&&setLoop(+x.dataset.i)});
  landObs=[io,lo];setLoop(0);$('pcap').dataset.i='';setTab(LS.tab);fitPv();onScroll()}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{if(S.mode==='landing'){fitPv();onScroll()}});
function go(v){S.view=v;S.skipAsk=null;render()}
let tt;function toast(m){toast_.textContent=m;toast_.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast_.classList.remove('show'),3000)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const {act,v,id,k,a}=b.dataset;
  if(act==='go')go(v);
  else if(act==='demo'){S=demo();render()}
  else if(act==='jump'){$(v).scrollIntoView({behavior:reduced()?'auto':'smooth'})}
  else if(act==='ltab'){const pr=$('product');if(pinned())scrollTo({top:pr.offsetTop+(+v+.5)/4*(pr.offsetHeight-innerHeight),behavior:reduced()?'auto':'smooth'});else setTab(+v)}
  else if(act==='lgb'){LS.gb[+v]=LS.gb[+v]?0:1;$('gbx').innerHTML=GBDemo()}
  else if(act==='lcareer'){LS.career=v;LS.plan=null;LS.busy=false;document.querySelectorAll('.csel button').forEach(e=>e.setAttribute('aria-pressed',e.dataset.v===v));$('aiwrap').innerHTML=AIDemo()}
  else if(act==='lplan'){LS.busy=true;$('aiwrap').innerHTML=AIDemo();const c=LS.career;setTimeout(()=>{if(LS.career!==c||S.mode!=='landing')return;LS.busy=false;LS.plan=withS(aiState(c),makePlan);$('aiwrap').innerHTML=AIDemo()},1400)}
  else if(act==='begin'){S.mode='onboarding';S.ob={step:0,name:'',career:'',other:'',stage:null,goal:null};render()}
  else if(act==='resume'){S.mode='app';render()}
  else if(act==='home'){S.mode='landing';S.ob=null;render()}
  else if(act==='obset'){S.ob[k]=k==='career'?v:+v;S.ob.err='';render(false);if(v==='Other')$('ob-other')?.focus()}
  else if(act==='obback'){S.ob.step--;S.ob.err='';render()}
  else if(act==='obnext'){
    const o=S.ob;o.err='';
    if(o.step===0&&!o.name.trim())o.err='Enter your name to continue.';
    if(o.step===1&&(!o.career||(o.career==='Other'&&!o.other.trim())))o.err=o.career?'Type the career you are working toward.':'Choose a career to continue.';
    if(o.step===2&&o.stage==null)o.err='Choose the option closest to where you are.';
    if(o.step===3&&o.goal==null)o.err='Choose a goal to continue.';
    if(o.err){render(false);return}
    o.step++;render();
    if(o.step===4)setTimeout(()=>{
      const career=o.career==='Other'?o.other.trim():o.career;
      S={...base(),mode:'app',demo:false,profile:{name:o.name.trim(),career,stage:o.stage,goal:o.goal},evidence:[]};
      S.skills=buildSkills(career,o.stage);render();toast('Your skill path is ready. Levels are self-reported until you add evidence.')},1700)}
  else if(act==='skill'){S.skillId=id;go('skill')}
  else if(act==='brief'){S.briefId=id;go('brief')}
  else if(act==='start'){const x=actById(id);S.active={id,checks:x.steps.map(()=>false),notes:''};go('progress')}
  else if(act==='skipask'){S.skipAsk=id;S.view='today';render();}
  else if(act==='skipcancel'){S.skipAsk=null;render(false)}
  else if(act==='skipdo'){S.skipped.push(id);S.skipAsk=null;render();const n=nextAction();toast(n&&n.id!==id?`Swapped (${v.toLowerCase()}). Next up: ${n.title}.`:'This is your only open action, so it stays on Today.')}
  else if(act==='add'){S.addCtx={skill:id||gapsSorted()[0]?.id||S.skills[0].id,action:a||null};go('add')}
  else if(act==='set'){S[k]=v;render(false)}
  else if(act==='plan'){S.planBusy=true;render(false);setTimeout(()=>{S.planBusy=false;S.plan=makePlan();render(false)},1500)}
  else if(act==='switch'){const old=S.skills;S.profile.career=v;S.skills=buildSkills(v,S.profile.stage,old);S.active=null;S.skipped=[];S.plan=null;S.cmp='';S.result=null;render();toast(`Target changed to ${v}. Your Skill Map has been rebuilt.`)}
  else if(act==='retryfile'){$('f-file').value='';$('e-file').hidden=true;$('f-file').click()}
  else if(act==='reset'){if(S.demo){S=demo();render();toast('Demo reset to its starting state.')}else{S=base();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('.check input')&&S.active){
    S.active.checks[+t.dataset.i]=t.checked;save();
    const c=S.active.checks,d=c.filter(Boolean).length,n=c.length;
    $('pb').style.width=d/n*100+'%';$('pc').textContent=`${d} of ${n} criteria done`;
    $('pb').parentNode.setAttribute('aria-valuenow',d);
    $('ph').textContent=d<n?'You can add evidence before every criterion is ticked.':'All criteria met. Add your work as evidence.';
  }
  if(t.id==='cmp'){S.cmp=t.value;render(false)}
  if(t.id==='f-file'&&t.files[0]){
    const f=t.files[0],big=f.size>5*1024*1024,bad=!/\.(pdf|png|jpe?g|webp|docx?|pptx?|xlsx?|csv|txt|md|zip|pbix|ipynb)$/i.test(f.name);
    $('e-file').hidden=!(big||bad);
    if(big||bad){$('e-file-msg').textContent=big?`“${f.name}” is ${(f.size/1048576).toFixed(1)} MB. The limit is 5 MB.`:`“${f.name}” is not a supported file type.`;t.value='';$('h-file').textContent='PDF, image or document, up to 5 MB.'}
    else $('h-file').textContent=`Attached: ${f.name}. This prototype records the file name only.`;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='notes'&&S.active){S.active.notes=t.value;save()}
  if(t.id==='ob-name'){S.ob.name=t.value;save()}
  if(t.id==='ob-other'){S.ob.other=t.value;save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('big')){e.preventDefault();root.querySelector('[data-act=obnext]').click()}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('f-title').value.trim(),link=$('f-link').value.trim(),badLink=link&&!/^https?:\/\/\S+\.\S+/.test(link);
  $('e-title').hidden=!!title;$('e-link').hidden=!badLink;
  if(!title){$('f-title').focus();return}
  if(badLink){$('f-link').focus();return}
  const f=e.target,skill=$('f-skill').value,strength=+f.str.value,s=sk(skill);
  const ev=E(skill,title,f.type.value,strength,$('f-desc').value.trim(),new Date().toISOString().slice(0,10));
  ev.link=link;ev.file=$('f-file').files[0]?.name||'';
  const before=s.level,wasUnv=s.unv,rb=ready();
  S.evidence.push(ev);
  s.level=Math.max(s.level,strength+1);
  if(strength+1>=s.level)s.unv=false;
  const kind=s.level!==before?'up':wasUnv&&!s.unv?'confirmed':'same';
  if(kind!=='same'){s.changed=++S.clock;S.history.push({date:ev.date,text:kind==='up'?`${s.name} moved from ${L[before]} to ${L[s.level]}`:`${s.name} confirmed at ${L[s.level]}`,why:`${title}, ${STR[strength].toLowerCase()}`})}
  if(S.active&&S.active.id.startsWith(skill+'-'))S.active=null;
  S.plan=null;
  if(kind!=='same')S.flash={skill,before,rb};
  S.result={skill,before,after:s.level,kind,wasUnv,readyBefore:rb,readyAfter:ready(),evIdx:S.evidence.length-1};
  go('assessing');
  setTimeout(()=>{if(S.view==='assessing')go('result')},1500);
});
render(false);
</script>
